<script>
(function () {
  "use strict";
  var cfg = null, memos = null, loadErr = "", busy = false, ROLE = "creator";
  var DOW = ["일", "월", "화", "수", "목", "금", "토"];
  var ERR = {
    unauthorized: "메모장 접근 키가 맞지 않아요. Apps Script를 '새 버전'으로 배포했는지 확인해 주세요.",
    bad_board: "메모장 설정이 올바르지 않아요.",
    bad_action: "Apps Script가 예전 버전이에요. 새 Code.gs로 바꾸고 '새 버전'으로 배포해 주세요.",
    empty_text: "내용을 입력해 주세요.",
    not_found: "이미 삭제된 메모예요."
  };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function el(id) { return document.getElementById(id); }
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function wide() { return window.matchMedia("(min-width:1280px)").matches; }
  function parseAt(s) { var m = /^(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{2})/.exec(s || ""); return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5]) : null; }
  function hm(d) { return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
  function roleName(r) { return r === "manager" ? cfg.manager : cfg.creator; }

  // 대시보드 잠금이 풀리면(복호화된 데이터에 메모장 설정이 있으면) 시작
  var wait = setInterval(function () {
    var app = el("app"), b = (typeof BUNDLE !== "undefined") ? BUNDLE : null;
    if (!app || app.classList.contains("hidden") || !b) return;
    clearInterval(wait);
    var m = b.memo || {};
    if (!m.url || !/^https:\/\/script\.google\.com\//.test(m.url) || !m.token || !m.board) return;   // 주소가 비어 있으면 표시하지 않음
    cfg = { url: m.url, token: m.token, board: m.board, creator: m.creator || "크리에이터", manager: m.manager || "소셜링 매니저" };
    build();
  }, 300);

  function build() {
    var c = esc(cfg.creator);
    var wrap = document.createElement("div");
    wrap.innerHTML =
      '<button type="button" id="mm-toggle" aria-controls="mm-aside" aria-expanded="false">💬 메모장<span class="mm-badge" id="mm-unread" hidden></span></button>' +
      '<aside id="mm-aside" aria-label="메모장">' +
        '<div class="mm-head"><div><h3>메모장</h3><p class="mm-note" id="mm-count"></p></div>' +
          '<button type="button" class="mm-x" id="mm-close" aria-label="메모장 닫기">×</button></div>' +
        '<div class="mm-pins" id="mm-pins" hidden></div>' +
        '<div class="mm-board" id="mm-list" aria-live="polite"><p class="mm-empty">메모 불러오는 중…</p></div>' +
        '<form class="mm-form" id="mm-form" autocomplete="off">' +
          '<div class="mm-row"><div class="mm-who" role="group" aria-label="보내는 사람"><span class="mm-note">보내는 사람</span>' +
            '<button type="button" class="mm-chip" data-role="creator" aria-pressed="true">' + c + '</button>' +
            '<button type="button" class="mm-chip" data-role="manager" aria-pressed="false">' + esc(cfg.manager) + '</button></div>' +
            '<label class="mm-pinopt" id="mm-pinopt" hidden><input type="checkbox" id="mm-pin"> 공지로 고정</label></div>' +
          '<label for="mm-text" class="mm-sr">메모 내용</label>' +
          '<textarea id="mm-text" maxlength="2000" placeholder="메모를 입력하세요 (Ctrl + Enter로 보내기)"></textarea>' +
          '<div class="mm-row"><span class="mm-status" id="mm-status" role="status"></span><button class="mm-send" type="submit" id="mm-send">보내기</button></div>' +
        '</form>' +
      '</aside>';
    while (wrap.firstChild) document.body.appendChild(wrap.firstChild);
    document.body.classList.add("mm-on");

    el("mm-toggle").addEventListener("click", function () { setOpen(true); });
    el("mm-close").addEventListener("click", function () { setOpen(false); el("mm-toggle").focus(); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && document.body.classList.contains("mm-open") && !wide()) setOpen(false); });
    el("mm-text").addEventListener("keydown", function (e) { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); } });
    el("mm-form").addEventListener("submit", function (e) { e.preventDefault(); send(); });
    el("mm-list").addEventListener("click", onListClick);
    var chips = document.querySelectorAll("#mm-aside [data-role]");
    for (var i = 0; i < chips.length; i++) chips[i].addEventListener("click", function () { setRole(this.getAttribute("data-role")); });

    setRole(ls("memo-role") === "manager" ? "manager" : "creator", true);
    var saved = ls("memo-open:" + cfg.board);
    setOpen(saved === null ? wide() : saved === "1" && wide(), false);   // 넓은 화면은 기본으로 열림, 좁은 화면은 버튼으로 열기
    load();
    setInterval(function () { if (document.visibilityState === "visible") load(); }, 60000);
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") load(); });
  }

  function setOpen(open, remember) {
    document.body.classList.toggle("mm-open", open);
    el("mm-toggle").setAttribute("aria-expanded", open);
    if (remember !== false) ls("memo-open:" + cfg.board, open ? "1" : "0");
    if (open) { var l = el("mm-list"); l.scrollTop = l.scrollHeight; if (!wide()) setTimeout(function () { el("mm-text").focus(); }, 60); }
  }
  function setRole(r, silent) {
    ROLE = r; ls("memo-role", r);
    var chips = document.querySelectorAll("#mm-aside [data-role]");
    for (var i = 0; i < chips.length; i++) chips[i].setAttribute("aria-pressed", chips[i].getAttribute("data-role") === r);
    el("mm-pinopt").hidden = r !== "manager";
    if (!silent) render(true);
  }
  function status(t, ok) { var s = el("mm-status"); s.className = "mm-status " + (t ? (ok ? "ok" : "bad") : ""); s.textContent = t || ""; }

  function api(body) {
    var payload = { token: cfg.token, board: cfg.board };
    for (var k in body) payload[k] = body[k];
    return fetch(cfg.url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload), redirect: "follow" })
      .then(function (r) { return r.json(); }, function () { throw new Error("network"); })
      .then(function (j) { if (!j || !j.ok) throw new Error((j && j.error) || "unknown"); return j.memos || []; });
  }
  function errText(e) {
    var k = e && e.message;
    if (ERR[k]) return ERR[k];
    if (k === "network") return "메모장 서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.";
    return "처리하지 못했어요. (" + k + ")";
  }

  function load() {
    if (busy) return;
    api({ action: "list" }).then(function (list) {
      var changed = !memos || JSON.stringify(memos) !== JSON.stringify(list);
      memos = list; loadErr = "";
      if (changed && !el("mm-list").querySelector("[data-del-yes]")) render(false);
    }, function (e) { loadErr = errText(e); if (!memos) render(false); });
  }
  function act(body, okText, btn) {
    busy = true; if (btn) btn.disabled = true;
    return api(body).then(function (list) { memos = list; loadErr = ""; if (okText) status(okText, true); else status(""); render(true); return true; },
      function (e) { status("저장하지 못했어요. " + errText(e), false); if (btn) btn.disabled = false; return false; })
      .then(function (ok) { busy = false; return ok; });
  }
  function send() {
    var text = el("mm-text").value.trim(), btn = el("mm-send");
    if (busy || btn.disabled) return;
    if (!text) { status("내용을 입력해 주세요.", false); el("mm-text").focus(); return; }
    btn.disabled = true; btn.textContent = "보내는 중…"; status("");
    act({ action: "add", role: ROLE, author: roleName(ROLE), text: text, pin: ROLE === "manager" && el("mm-pin").checked }, "저장했어요.").then(function (ok) {

  }

  function onListClick(e) {
    var b = e.target.closest("button");

    else if (b.hasAttribute("data-del")) {
      b.parentNode.innerHTML = '<span class="mm-note" style="margin:0">이 메모를 삭제할까요?</span>' +
        '<button type="button" class="mm-link del" data-del-yes="' + esc(b.getAttribute("data-del")) + '">삭제</button>' +
        '<button type="button" class="mm-link" data-cancel>취소</button>';
    }
    else if (b.hasAttribute("data-del-yes")) act({ action: "delete", id: b.getAttribute("data-del-yes") }, "삭제했어요.", b);

  function render(toBottom) {
    var list = el("mm-list");
    var nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 60;
    if (!memos) {
      list.innerHTML = '<p class="mm-empty">' + (loadErr ? "메모를 불러오지 못했어요. " + esc(loadErr) : "메모 불러오는 중…") + '</p>';
      el("mm-count").textContent = esc(cfg.creator) ? cfg.creator + "님과 소셜링이 주고받는 메모" : "";
      return;
    }
    var waitFor = function (r) { return memos.filter(function (m) { return m.role !== r && !m.checkedAt; }).length; };
    el("mm-count").textContent = memos.length
      ? cfg.creator + " 확인 대기 " + waitFor("creator") + "건 · 매니저 확인 대기 " + waitFor("manager") + "건"

    var unread = waitFor(ROLE), ub = el("mm-unread"); ub.hidden = !unread; ub.textContent = unread > 99 ? "99+" : unread;

    var pins = memos.filter(function (m) { return m.pin; }).slice(-3).reverse(), pb = el("mm-pins");
    pb.hidden = !pins.length;
    pb.innerHTML = pins.map(function (m) { return '<div><b>📌 공지</b>' + esc(m.text) + '</div>'; }).join("");

    var lastDay = "", html = "";
    memos.forEach(function (m) {
      var d = parseAt(m.at), day = d ? d.getFullYear() + "." + (d.getMonth() + 1) + "." + d.getDate() + " (" + DOW[d.getDay()] + ")" : "";
      if (day && day !== lastDay) { html += '<div class="mm-day">' + day + '</div>'; lastDay = day; }
      var mine = m.role === ROLE, other = m.role === "manager" ? cfg.creator : "매니저";
      var cd = parseAt(m.checkedAt);
      var st = m.checkedAt
        ? '<span class="mm-pill yes">✓ ' + esc(m.checkedBy || other) + ' 확인 ' + (cd ? hm(cd) : "") + '</span>'
        : '<span class="mm-pill wip">' + esc(other) + ' 확인 대기</span>';
      html += '<div class="mm-msg ' + m.role + '">' +
        '<div class="mm-meta"><b>' + esc(m.author) + '</b><span>' + (d ? hm(d) : esc(m.at)) + '</span>' + (m.pin ? '<span class="mm-pill">📌 공지</span>' : "") + '</div>' +
        '<div class="mm-bub">' + esc(m.text) + '</div>' +
        '<div class="mm-acts">' + st +
          (!mine && !m.checkedAt ? '<button type="button" class="mm-link" data-check="' + esc(m.id) + '">확인했어요</button>' : "") +
          (ROLE === "manager" && m.role === "manager" ? '<button type="button" class="mm-link" data-pin="' + esc(m.id) + '" data-on="' + (m.pin ? "0" : "1") + '">' + (m.pin ? "공지 해제" : "공지로 고정") + '</button>' : "") +
          (mine ? '<button type="button" class="mm-link del" data-del="' + esc(m.id) + '">삭제</button>' : "") +
        '</div></div>';
    });
    list.innerHTML = html || '<p class="mm-empty">아직 메모가 없어요. 첫 메모를 남겨 보세요.</p>';
    if (toBottom || nearBottom) list.scrollTop = list.scrollHeight;
  }
})();
</script>
<!-- ===== 공유 메모장 위젯 끝 ===== -->
<script>
(function () {
  var m = location.hash.match(/[#&]auto=([^&]+)/);
  if (!m) return;
  var pw = decodeURIComponent(m[1]);
  history.replaceState(null, "", location.pathname + location.search);
  function tryUnlock(n) {
    var input = document.querySelector('input[type="password"]');
    if (!input) { if (n < 50) setTimeout(function () { tryUnlock(n + 1); }, 100); return; }
    input.value = pw;
    input.dispatchEvent(new Event("input", { bubbles: true }));
    var btn = [].slice.call(document.querySelectorAll('button, input[type="submit"]'))
      .filter(function (b) { return /입장/.test(b.textContent || b.value || ""); })[0];
    if (btn) btn.click();
    else if (input.form) { input.form.requestSubmit ? input.form.requestSubmit() : input.form.submit(); }
    else input.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function () { tryUnlock(0); });
  else tryUnlock(0);
})();
</script>
